name: Release

# Publishes to npm, with trusted publishing, each package whose `version` changed (#192). Every
# package versions on its own; a release is a merged version bump:
#   push to main           the packages whose version differs from the commit before the push
#   pull_request           the same packages the merge would publish, with `npm publish --dry-run`
#   workflow_dispatch      every package whose version is not on npm (first release, recovery);
#                          a dry run unless `dry_run` is unticked
# A `name@version` already on npm is never a candidate. After a publish, the `tag` job pushes a
# `<name>@<version>` tag for the record; nothing runs on tags. The procedure and the one-time
# npm setup are in RELEASING.md. npm matches the trusted publisher on this file's name: renaming
# release.yml breaks publishing until each package's trusted-publisher entry on npmjs.com is
# updated to the new name.

on:
  push:
    branches: [main]
    paths: ["packages/*/package.json"]
  pull_request:
    paths: ["packages/*/package.json"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything but publish with `npm publish --dry-run`"
        type: boolean
        default: true

permissions:
  contents: read

# One run per ref at a time, never cancelled halfway. `queue: max` keeps every waiting run: the
# default keeps only the newest, which would drop the version bump of a push in between.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # Pull requests and dry-run dispatches: no environment, no secret referenced (NPM_TOKEN is a
  # repository secret, readable by any job that names it), no id-token.
  dry-run:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    env:
      # The texture decode tests fail instead of skipping when the WASM is missing.
      REQUIRE_WASM: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The plan reads the package.json files at the base commit.
          fetch-depth: 0
      - name: Plan and gate
        id: gate
        uses: ./.github/actions/release-gate
      - name: Publish (dry run)
        if: steps.gate.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.gate.outputs.packages }}
        # --ignore-scripts: the gate ran the full verify already; each reader package's
        # prepublishOnly would rerun it once per package.
        run: |
          for spec in $PACKAGES; do
            echo "::group::$spec"
            npm publish -w "${spec%@*}" --access public --ignore-scripts --dry-run
            echo "::endgroup::"
          done

  # Pushes to main and dispatches with `dry_run` unticked. npm's trusted publisher checks the
  # repository, this file's name and the environment, not the ref, so the `npm` environment
  # (deployment rule: branch main) is what keeps any other branch from publishing. Each package's
  # trusted publisher names it. The only job that reads the NPM_TOKEN repository secret.
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    environment: npm
    # id-token: write lets npm exchange the job's OIDC token for a publish token and sign the
    # provenance.
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      REQUIRE_WASM: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Plan and gate
        id: gate
        uses: ./.github/actions/release-gate

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0
      # (https://docs.npmjs.com/trusted-publishers). setup-node's `22` is the latest 22.x.
      - name: Install npm 11
        if: steps.gate.outputs.packages != ''
        run: |
          npm install -g npm@^11.5.1
          node -e 'const [a, b] = process.versions.node.split(".").map(Number);
            if (a < 22 || (a === 22 && b < 14)) throw new Error("Node " + process.version + " < 22.14.0");'
          echo "node $(node --version), npm $(npm --version)"

      # In the plan's order (dependencies first). A name@version already on npm is skipped, so a
      # run that failed halfway can be re-run. --ignore-scripts: the gate above ran the full verify
      # and built every dist/; each reader package's prepublishOnly would rerun it per package.
      # No token: npm authenticates with the job's OIDC token and adds provenance by itself. The
      # NPM_TOKEN secret exists only for the first publish (the bootstrap in RELEASING.md) and is
      # deleted right after it.
      - name: Publish
        id: publish
        if: steps.gate.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.gate.outputs.packages }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is set; delete it once trusted publishing is set up."
            echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$HOME/.npmrc"
          fi
          published=()
          # Written on any exit, so what got out before a failure is still tagged.
          trap 'echo "published=${published[*]}" >> "$GITHUB_OUTPUT"' EXIT
          for spec in $PACKAGES; do
            version="${spec##*@}"
            if [ "$(npm view "$spec" version 2>/dev/null || true)" = "$version" ]; then
              echo "::notice::$spec is already on npm, skipping."
              continue
            fi
            echo "::group::$spec"
            npm publish -w "${spec%@*}" --access public --ignore-scripts
            echo "::endgroup::"
            published+=("$spec")
          done

  # A `<name>@<version>` tag on the released commit for each package the publish job got out,
  # also when a later one failed. Tags are records only: nothing triggers on them, and a tag
  # pushed with GITHUB_TOKEN starts no workflow anyway. The only job that can write to the repo,
  # and it runs no npm code.
  tag:
    needs: publish
    if: always() && needs.publish.outputs.published != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        env:
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for spec in $PUBLISHED; do
            if [ -n "$(git ls-remote --tags origin "refs/tags/$spec")" ]; then
              echo "::notice::Tag $spec exists already, skipping."
              continue
            fi
            git tag -a "$spec" -m "$spec" "$GITHUB_SHA"
            git push origin "refs/tags/$spec"
          done
