name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filters live here, not in `on.paths`: a workflow skipped by `paths` never reports
  # its checks, so required status checks would hang. A job skipped by `if` reports success.
  changes:
    runs-on: ubuntu-latest
    outputs:
      reader: ${{ steps.filter.outputs.reader }}
      decoder: ${{ steps.filter.outputs.decoder }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          # Pushes to main always run everything.
          if [ "$EVENT" != "pull_request" ]; then
            echo "reader=true" >> "$GITHUB_OUTPUT"
            echo "decoder=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          if echo "$files" | grep -qE '^(packages/(core|texture|node|mesh|audio|spine)/|fixtures/|scripts/|\.github/|package(-lock)?\.json$|tsconfig[^/]*\.json$|rollup\.reader\.mjs$)'; then
            echo "reader=true" >> "$GITHUB_OUTPUT"
          else
            echo "reader=false" >> "$GITHUB_OUTPUT"
          fi
          # The decoder job also runs the texture package's decode tests (#119), the
          # Playwright tests of examples/ (#35) and of the docs/ demo (#209), and the Node.js
          # floor check (#172), so it runs for what they build from: core, texture, fixtures,
          # the reader build config, the examples, the demo page and the floor check script.
          if echo "$files" | grep -qE '^(packages/(decoder|core|texture)/|fixtures/|examples/|docs/demo/|docs/[^/]*\.html$|scripts/check-node-floor\.mjs$|\.github/|package(-lock)?\.json$|tsconfig[^/]*\.json$|rollup\.reader\.mjs$)'; then
            echo "decoder=true" >> "$GITHUB_OUTPUT"
          else
            echo "decoder=false" >> "$GITHUB_OUTPUT"
          fi

  # Build every package (TS only), test, browser guard, no-C# guard. No submodules, no Docker.
  reader:
    name: reader (node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.reader == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  # The lowest Node.js versions the reader packages' `engines` admits (#172): the same verify,
  # then `import` and `require()` of the three packages' builds. No WASM here, so the smoke
  # check skips the decode; the decoder job runs it with the WASM on these versions.
  # scripts/tests/engines.test.mjs keeps this matrix equal to `engines`.
  reader-floor:
    name: reader floor (node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.reader == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "22.12.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node scripts/check-node-floor.mjs

  # Rebuilds the WASM (Docker, needs the C++ submodule) and runs the decoder tests, then the
  # texture package's tests, whose decode tests need that WASM and skip in `reader` (#119),
  # then the Playwright tests of examples/cdn.html (#35) and the docs/ demo (#209) in Chromium,
  # then the Node.js floor check with
  # the WASM (#172).
  decoder:
    name: decoder
    needs: changes
    if: needs.changes.outputs.decoder == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run build:rollup
      - run: npm test -w texture2ddecoder-wasm
      - run: npm run build -w unity-asset-reader
      # REQUIRE_WASM=1: a missing WASM fails decode.test.ts instead of skipping it.
      - run: npm test -w unity-asset-reader-texture
        env:
          REQUIRE_WASM: "1"
      # The Playwright tests: examples/cdn.html (#35) and the docs/ demo page (#209). They
      # run here because initTexture loads the WASM even for a plain-format texture, and
      # this is the job that builds it.
      # Core and texture dist/ come from the steps above.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: examples/test-results/
          if-no-files-found: ignore
      # initTexture() and a decode, with `import` and `require()`, on the lowest Node.js
      # versions of the reader packages' `engines` (#172), with the WASM built above.
      # Keep these equal to the reader-floor matrix. Core and texture dist/ come from above.
      - run: npm run build -w unity-asset-reader-node
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - run: node scripts/check-node-floor.mjs
        env:
          REQUIRE_WASM: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: node scripts/check-node-floor.mjs
        env:
          REQUIRE_WASM: "1"
